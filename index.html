adj(id){const v=Math.round(+$('#aa').value),w=$('#ar').value.trim();if(!v||!w){toast('Enter an amount and a reason');return}(S.adj[id]=S.adj[id]||[]).push({amt:v,why:w});A.log('Adjustment of '+pkr(v)+' for '+tech(id).name+': '+esc(w));delete S.apv[id];save();modal();render();toast('Saved. Approve again to confirm the new net pay')},
appr(id,n){S.apv[id]={amt:n,at:Date.now()};A.log('Approved '+pkr(n)+' for '+tech(id).name);save();render()},
reset(){if(confirm('Reset all demo data to the original sample set?')){S=seed();save();location.hash='';render();toast('Demo data reset')}},
tg(n,el){if(sel.has(n))sel.delete(n);else sel.set(n,$('#ft').value);el.classList.toggle('on',sel.has(n));el.innerHTML=n+(sel.has(n)?'<br><small>'+sel.get(n).slice(0,4)+'</small>':'');A.upd()},
upd(){const m=$('#fm'),u=$('#fr');if(m)$('#tc').textContent=sel.size+' unit(s), '+pkr(sel.size*MAT[m.value][0]*(u.value=='Urgent'?1.2:1))},
sub(e){e.preventDefault();if(!sel.size){toast('Select at least one tooth on the chart');return false}const due=new Date($('#fe').value).getTime(),now=Date.now();if(!due||due<sod()){toast('Choose a delivery date that is today or later');return false}
const c={id:'RM-'+(3000+S.cases.length),doc:S.role=='admin'?$('#fd').value:me().id,pt:$('#fp').value.trim(),teeth:[...sel.keys()].sort((a,b)=>a-b),ty:new Set(sel.values()).size>1?'Mixed':[...sel.values()][0],tt:Object.fromEntries(sel),mat:$('#fm').value,shade:$('#fs').value,cr:now,due,pr:$('#fr').value,s:0,tech:null,hist:[{s:0,at:now,by:S.role=='admin'?'Front desk':'Doctor portal'}],rev:0,run:null,spent:0,notes:$('#fn').value.trim(),inv:null};
S.cases.push(c);save();toast('Case '+c.id+' submitted');go('case/'+c.id);return false},
adv(id){const c=cs(id),p=MAT[c.mat][1],n=p[p.indexOf(c.s)+1];if(n===undefined)return;if(n>=2&&!c.tech){toast('Assign a technician before moving to '+ST[n]);return}
if(c.run){c.spent+=Date.now()-c.run;c.run=null}c.hist.push({s:n,at:Date.now(),by:S.role=='tech'?me().name:n==8?'Rider (simulated)':'Lab admin'});A.dsp(c,n);save();render();toast(c.id+' moved to '+ST[n])},
asg(id,t){const c=cs(id);c.tech=t||null;c.hist.push({s:c.s,at:Date.now(),by:'Lab admin',note:t?'Assigned to '+tech(t).name:'Unassigned'});save();render();toast(t?'Assigned to '+tech(t).name:'Technician removed')},
start(id){cs(id).run=Date.now();save();render()},pause(id){const c=cs(id);c.spent+=Date.now()-c.run;c.run=null;save();render()},
rev(id){const c=cs(id);c.rev++;c.hist.push({s:c.s,at:Date.now(),by:doc(c.doc).name,note:'Revision requested'});save();render();toast('Revision request sent to the lab')},
gen(id){const c=cs(id),i={id:'INV-'+(101+S.inv.length),case:id,doc:c.doc,total:price(c),at:Date.now()};S.inv.push(i);c.inv=i.id;save();render();toast('Invoice '+i.id+' generated')},
payM(id){const i=S.inv.find(x=>x.id==id),b=i.total-paid(id);modal(`<h2>Record payment</h2><p class=mut>${id}, balance ${pkr(b)}</p><label class=mut>Amount (PKR)<input id=pa type=number min=1 max=${b} value=${b} style="width:100%"></label><div class="row mt"><button class=p onclick="A.pay('${id}')">Save payment</button><button class=s onclick="modal()">Cancel</button></div>`)},
pay(id){const i=S.inv.find(x=>x.id==id),b=i.total-paid(id),v=Math.round(+$('#pa').value);if(!(v>0&&v<=b)){toast('Enter an amount between 1 and '+b);return}S.pay.push({inv:id,amt:v,at:Date.now()});save();modal();render();toast('Payment of '+pkr(v)+' recorded')}};
function render(){if(cloud&&!(user&&tid))return;const p=(location.hash.slice(2)||'').split('/'),nv=NAV[S.role];cur=p[0];if(cur!='case'&&!nv.some(n=>n[0]==cur))cur=nv[0][0];
const body=cur=='case'?V.case(p[1]):V[cur]();
$('#app').innerHTML=`<header class=top><div class=in><a class=logo href="#/">ROMAN<small>رومان</small></a><nav class=dnav aria-label="Main">${nv.map(n=>`<a href="#/${n[0]}" class="${cur==n[0]?'on':''}">${n[1]}</a>`).join('')}</nav><div class=tools><label class=sr for=rl>Demo role</label><select id=rl onchange="A.role(this.value)">${[['admin','Lab owner / admin'],['doctor','Doctor, '+S.docs[0].name],['tech','Technician, '+S.techs[0].name],['rider','Rider, '+S.riders[0]]].map(r=>`<option value=${r[0]} ${S.role==r[0]?'selected':''}>${r[1]}`).join('')}</select><details class=mn><summary aria-label="Menu">⋯</summary><div><button class=g onclick="A.theme()">Switch light or dark</button><button class=g onclick="A.reset()">Reset demo data</button>${cloud&&user?`<button class=g onclick="cloud.auth.signOut()">Sign out ${esc(user.email||'')}</button>`:''}<p class=sub>${cloud?'Cloud mode: saved to your workspace. The role switch is a demo control, not access control.':'Demo mode: fictional data stored only in this browser.'}</p></div></details></div></div></header><main>${body}</main><nav class=tabs aria-label="Mobile">${nv.map(n=>`<a href="#/${n[0]}" class="${cur==n[0]?'on':''}">${IC[n[0]]||''}<span>${n[1]}</span></a>`).join('')}</nav>`;window.scrollTo(0,0)}
try{const th=localStorage.getItem('romtheme');if(th)document.documentElement.dataset.theme=th}catch(e){}addEventListener('hashchange',render);setInterval(()=>document.querySelectorAll('[data-run]').forEach(e=>e.textContent=dur(+e.dataset.sp+Date.now()-e.dataset.run)),30000);
async function push(){if(!cloud||!tid||!user)return;const r=await cloud.from('app_state').upsert({tenant_id:tid,state:S,updated_by:user.id,updated_at:new Date().toISOString()});if(r.error)toast('Cloud save failed: '+r.error.message)}
function gate(m){$('#app').innerHTML=`<main style="max-width:420px;margin:12vh auto"><h1>ROMAN</h1><p class=mut>${m=='setup'?'Name your lab to create your workspace.':'Sign in to your lab workspace.'}</p><div class="card mt">${m=='setup'?`<label class=mut>Lab name<input id=ln style="width:100%" maxlength=60></label><div class="row mt"><button class=p onclick="A.mk()">Create workspace</button><button class=s onclick="cloud.auth.signOut()">Sign out</button></div>`:`<button class=p style="width:100%" onclick="A.goog()">Continue with Google</button><p class=mut style="text-align:center">or</p><input id=em type=email placeholder="you@lab.com" style="width:100%" aria-label="Email"><div class=mt><button class=s style="width:100%" onclick="A.mail()">Email me a sign-in link</button></div>`}</div><p class=mut>Fictional demo data only. Do not enter real patient records.</p></main>`}
async function boot(){if(!cloud){render();return}
const g=await cloud.auth.getSession();user=g.data.session?g.data.session.user:null;
if(!boot.w){boot.w=1;cloud.auth.onAuthStateChange((e,s)=>{const u=s?s.user:null;if((u&&u.id)!=(user&&user.id)){user=u;tid=null;boot()}})}
if(!user){gate();return}
const t=await cloud.rpc('my_tenant');tid=t.data;if(!tid){gate('setup');return}
const st=await cloud.from('app_state').select('state').eq('tenant_id',tid).maybeSingle();
if(st.data&&st.data.state)S=ensure(st.data.state);else await push();render()}
boot();
</script></body></html>
